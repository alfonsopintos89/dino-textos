name: textosaurio

# Corre los tests y después puntúa los .md que cambiaron en el push.
# Frena si el general de alguno queda abajo de 8.
# Sin dependencias que instalar: el script es biblioteca estándar.
#
# Para usarlo en tu repo: copiá tools/textosaurio.py a tu repo, copiá este
# archivo a .github/workflows/ y borrá el paso de tests.

on:
  push:
  pull_request:

jobs:
  puntuar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'   # el mismo que trae macOS de fábrica

      - name: tests
        run: |
          python3 tools/test_textosaurio.py
          python3 corpus/test_calibrar.py

      - name: puntuar los textos que cambiaron
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$base" ]; then
            echo "sin base de comparación, no hay nada que puntuar"
            exit 0
          fi
          fallaron=0
          for archivo in $(git diff --name-only --diff-filter=d "$base" HEAD -- '*.md' \
                           | grep -v -E '^(ejemplos|corpus|docs)/'); do
            echo "── $archivo"
            python3 tools/textosaurio.py "$archivo" --minimo 8 || fallaron=1
          done
          exit $fallaron
